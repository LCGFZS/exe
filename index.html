<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des fichiers du dépôt</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 20px; 
            background: #0d1117; /* Fond sombre GitHub */
            color: #c9d1d9; /* Texte clair */
        }
        h1 { text-align: center; font-size: 24px; margin-bottom: 20px; color: #f0f6fc; }
        .list-container { 
            background: #161b22; 
            padding: 10px 20px; 
            border: 1px solid #30363d; 
            border-radius: 6px; 
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 16px 0; 
            border-bottom: 1px solid #21262d; 
        }
        li:last-child { border-bottom: none; }
        .filename { font-weight: 600; font-size: 14px; color: #c9d1d9; }
        .btn { 
            background-color: #238636; 
            color: white; 
            text-decoration: none; 
            padding: 6px 12px; 
            border-radius: 6px; 
            font-size: 14px; 
            font-weight: 500; 
            display: inline-block; 
        }
        .btn:hover { background-color: #2ea44f; }
    </style>
</head>
<body>

    <h1>Fichiers disponibles</h1>
    <div class="list-container">
        <ul>
            <li>
                <span class="filename">README.md</span>
                <a href="auto README.md" class="btn" download>Télécharger</a>
            </li>

            <li>
                <span class="filename">auto clicker.exe</span>
                <a href="auto clicker.exe" class="btn" download>Télécharger</a>
            </li>
            <li>
                <span class="filename">macro.part_0</span>
                <a href="macro.part_0" class="btn" download>Télécharger</a>
            </li>
            <li>
                <span class="filename">macro.part_1</span>
                <a href="macro.part_1" class="btn" download>Télécharger</a>
            </li>
        </ul>
    </div>

</body>
</html>
