<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichiers disponibles</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 40px 16px;
        background: #0d1017;
        color: #c9d1d9;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { text-align: center; color: #fff; margin: 0 0 32px; }
    .list-container {
        max-width: 600px;
        margin: 0 auto;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 8px 20px;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    .list-container > ul > li { padding: 16px 0; border-bottom: 1px solid #21262d; }
    .list-container > ul > li:last-child { border-bottom: none; }
    li, summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
    }
    .filename { font-weight: 600; font-size: 14px; }
    .btn {
        background: #238636;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px 14px;
        font: 600 14px inherit;
        font-family: inherit;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
    }
    .btn:hover { background: #2ea043; }
    .btn:disabled { background: #2ea043; opacity: .6; cursor: wait; }
    .btn:focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }

    .dropdown { width: 100%; }
    .dropdown summary { cursor: pointer; list-style: none; }
    .dropdown summary::-webkit-details-marker { display: none; }
    .dropdown summary .filename::before { content: "▸ "; }
    .dropdown[open] summary .filename::before { content: "▾ "; }
    .sublist { margin-top: 12px; }
    .sublist li { padding: 8px 0 8px 20px; }
</style>
</head>
<body>

<h1>Fichiers disponibles</h1>
<div class="list-container">
    <ul>
        <li>
            <span class="filename">ReadMe pour spécificités</span>
            <a href="README.md" class="btn" download>Télécharger</a>
        </li>
        <li>
            <span class="filename">Script Powershell pour split un fichier</span>
            <a href="split.ps1" class="btn" download>Télécharger</a>
        </li>
        <li>
            <span class="filename">autoclicker</span>
            <a href="autoclicker.exe" class="btn" download>Télécharger</a>
        </li>
        <li>
            <details class="dropdown">
                <summary>
                    <span class="filename">macro.exe</span>
                    <button type="button" class="btn" id="dl-all">Tout Télécharger</button>
                </summary>
                <ul class="sublist">
                    <li>
                        <span class="filename">Partie 1</span>
                        <a href="macro.exe/macro_p1" class="btn" download>Télécharger</a>
                    </li>
                    <li>
                        <span class="filename">Partie 2</span>
                        <a href="macro.exe/macro_p2" class="btn" download>Télécharger</a>
                    </li>
                    <li>
                        <span class="filename">script de recompilage</span>
                        <a href="macro.exe/recompiler_macro.bat" class="btn" download>Télécharger</a>
                    </li>
                </ul>
            </details>
        </li>
    </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
document.getElementById('dl-all').addEventListener('click', async (e) => {
    e.preventDefault();
    e.stopPropagation();

    const btn = e.currentTarget;
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Préparation...';

    try {
        const files = {
            'macro_p1': 'macro.exe/macro_p1',
            'macro_p2': 'macro.exe/macro_p2',
            'recompiler_macro.bat': 'macro.exe/recompiler_macro.bat'
        };

        const zip = new JSZip();
        const folder = zip.folder('macro.exe');

        for (const [name, url] of Object.entries(files)) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`Échec du téléchargement : ${name}`);
            folder.file(name, await res.blob());
        }

        const content = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = 'macro.exe.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);
    } catch (err) {
        alert('Erreur lors de la préparation du zip : ' + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = originalText;
    }
});
</script>

</body>
</html>
